<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLS Brindes - Módulo Financeiro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0b132b; color: #ffffff; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #ffb703; font-size: 2rem; margin-bottom: 5px; }
        p { color: #8d99ae; }
        
        .cards { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .card { background: #1c2541; padding: 20px; border-radius: 8px; width: 250px; text-align: center; border-left: 5px solid #ffb703; }
        .card h3 { font-size: 1rem; color: #8d99ae; margin-bottom: 10px; }
        .card p { font-size: 1.5rem; font-weight: bold; color: #ffffff; }
        .card.entrada { border-left-color: #2ec4b6; }
        .card.saida { border-left-color: #e71d36; }

        .form-container, .table-container { background: #1c2541; padding: 20px; border-radius: 8px; max-width: 800px; margin: 0 auto 30px auto; }
        h2 { font-size: 1.3rem; color: #ffb703; margin-bottom: 15px; }
        
        form { display: grid; grid-template-columns: 1fr 2fr 1fr 1fr; gap: 10px; }
        @media(max-width: 768px) { form { grid-template-columns: 1fr; } }
        
        input, select, button { padding: 10px; border-radius: 4px; border: none; font-size: 1rem; }
        input, select { background: #0b132b; color: #ffffff; border: 1px solid #3a506b; }
        button { background: #ffb703; color: #0b132b; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #fb8500; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #3a506b; }
        th { color: #ffb703; }
        .tipo-entrada { color: #2ec4b6; font-weight: bold; }
        .tipo-saida { color: #e71d36; font-weight: bold; }
        .btn-apagar { background: #e71d36; color: white; padding: 5px 10px; font-size: 0.8rem; }
        .btn-apagar:hover { background: #d90429; }
    </style>
</head>
<body>

    <header>
        <h1>MLS Brindes</h1>
        <p>Sistema de Gestão - Módulo Financeiro</p>
    </header>

    <div class="cards">
        <div class="card entrada">
            <h3>Total Entradas</h3>
            <p id="totalEntradas">R$ 0,00</p>
        </div>
        <div class="card saida">
            <h3>Total Saídas</h3>
            <p id="totalSaidas">R$ 0,00</p>
        </div>
        <div class="card">
            <h3>Saldo em Caixa</h3>
            <p id="saldoCaixa">R$ 0,00</p>
        </div>
    </div>

    <div class="form-container">
        <h2>Registar Movimentação</h2>
        <form id="financeForm">
            <select id="tipo" required>
                <option value="Entrada">Entrada (Receita)</option>
                <option value="Saída">Saída (Despesa)</option>
            </select>
            <input type="text" id="descricao" placeholder="Descrição (ex: Adiantamento Cliente)" required>
            <input type="number" id="valor" step="0.01" placeholder="Valor (R$)" required>
            <button type="submit">Adicionar</button>
        </form>
    </div>

    <div class="table-container">
        <h2>Histórico Financeiro</h2>
        <table>
            <thead>
                <tr>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaMovimentacoes">
                <!-- Os dados aparecem aqui automaticamente -->
            </tbody>
        </table>
    </div>

    <script>
        let transacoes = JSON.parse(localStorage.getItem('mls_financeiro')) || [];

        const form = document.getElementById('financeForm');
        const tabela = document.getElementById('tabelaMovimentacoes');
        const elEntradas = document.getElementById('totalEntradas');
        const elSaidas = document.getElementById('totalSaidas');
        const elSaldo = document.getElementById('saldoCaixa');

        function atualizarDashboard() {
            tabela.innerHTML = '';
            let entradas = 0;
            let saidas = 0;

            transacoes.forEach((t, index) => {
                if (t.tipo === 'Entrada') entradas += Number(t.valor);
                else saidas += Number(t.valor);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="${t.tipo === 'Entrada' ? 'tipo-entrada' : 'tipo-saida'}">${t.tipo}</td>
                    <td>${t.descricao}</td>
                    <td>R$ ${Number(t.valor).toFixed(2)}</td>
                    <td><button class="btn-apagar" onclick="removerTransacao(${index})">X</button></td>
                `;
                tabela.appendChild(tr);
            });

            let saldo = entradas - saidas;

            elEntradas.innerText = `R$ ${entradas.toFixed(2)}`;
            elSaidas.innerText = `R$ ${saidas.toFixed(2)}`;
            elSaldo.innerText = `R$ ${saldo.toFixed(2)}`;

            localStorage.setItem('mls_financeiro', JSON.stringify(transacoes));
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const novaTransacao = {
                tipo: document.getElementById('tipo').value,
                descricao: document.getElementById('descricao').value,
                valor: parseFloat(document.getElementById('valor').value)
            };
            transacoes.push(novaTransacao);
            form.reset();
            atualizarDashboard();
        });

        function removerTransacao(index) {
            transacoes.splice(index, 1);
            atualizarDashboard();
        }

        atualizarDashboard();
    </script>
</body>
</html>
